<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="theme-color" content="#0F1B2D">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script>
        // Apply saved theme before paint to avoid flash of wrong theme.
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'light' || saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* fall through to system preference */ }
        })();
    </script>
</head>
<body>
    <div class="page">
        {% include header.html %}

        <main class="page-main">
            {{ content }}
        </main>

        {% include footer.html %}
    </div>

    <script>
        // Theme toggle
        (function () {
            var btn = document.querySelector('.theme-toggle');
            if (!btn) return;
            var mql = window.matchMedia('(prefers-color-scheme: dark)');
            function currentTheme() {
                var override = document.documentElement.getAttribute('data-theme');
                if (override === 'light' || override === 'dark') return override;
                return mql.matches ? 'dark' : 'light';
            }
            btn.addEventListener('click', function () {
                var next = currentTheme() === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
            });
        })();

        // Rotating tagline — lateral slide + fade, 4.5s hold
        (function () {
            var nodes = document.querySelectorAll('[data-question]');
            if (nodes.length < 2) return;

            var HOLD = 4500;   // ms each line rests
            var MOVE = 760;    // ms slide + fade
            var idx = 0;
            var timer = null;
            var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

            function show(next) {
                if (next === idx) return;
                var cur = nodes[idx];
                cur.classList.remove('is-visible');
                cur.classList.add('is-leaving');
                cur.setAttribute('aria-hidden', 'true');
                setTimeout(function () { cur.classList.remove('is-leaving'); }, MOVE);
                nodes[next].classList.remove('is-leaving');
                nodes[next].classList.add('is-visible');
                nodes[next].removeAttribute('aria-hidden');
                idx = next;
            }

            function start() {
                if (reducedMotion.matches || timer) return;
                timer = setInterval(function () { show((idx + 1) % nodes.length); }, HOLD);
            }

            function stop() {
                if (timer) { clearInterval(timer); timer = null; }
            }

            start();

            var container = document.querySelector('.rotating-headline');
            if (container) {
                container.addEventListener('mouseenter', stop);
                container.addEventListener('mouseleave', start);
                container.addEventListener('focusin', stop);
                container.addEventListener('focusout', start);
            }

            // Pause when the tab is hidden to save resources
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
                else start();
            });

            try {
                reducedMotion.addEventListener('change', function () {
                    if (reducedMotion.matches) stop();
                    else start();
                });
            } catch (e) { /* older browsers — ignore */ }
        })();

        // Expanding menu — first click opens the branch in place (no navigation)
        (function () {
            document.querySelectorAll('.path-head').forEach(function (h) {
                h.addEventListener('click', function () {
                    var card = h.closest('.path-card');
                    var open = card.classList.toggle('open');
                    h.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            });
        })();
    </script>
</body>
</html>
