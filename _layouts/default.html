<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
    <meta name="theme-color" content="#15293f">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">

    <!-- Favicons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Schuck Data">
    <meta property="og:title" content="{{ page.social_title | default: page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.social_title | default: page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ site.url }}/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    {% if page.hero_anim %}<canvas class="hero-anim" id="heroAnim" aria-hidden="true"></canvas>{% endif %}
    <div class="page">
        {% include header.html %}

        <main class="page-main">
            {{ content }}
        </main>

        {% include footer.html %}
    </div>

    <script>
        // Rotating tagline — lateral slide + fade, 4.5s hold
        (function () {
            var nodes = document.querySelectorAll('[data-question]');
            if (nodes.length < 2) return;

            var HOLD = 4500;   // ms each line rests
            var MOVE = 760;    // ms slide + fade
            var idx = 0;
            var timer = null;
            var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

            function show(next) {
                if (next === idx) return;
                var cur = nodes[idx];
                cur.classList.remove('is-visible');
                cur.classList.add('is-leaving');
                cur.setAttribute('aria-hidden', 'true');
                setTimeout(function () { cur.classList.remove('is-leaving'); }, MOVE);
                nodes[next].classList.remove('is-leaving');
                nodes[next].classList.add('is-visible');
                nodes[next].removeAttribute('aria-hidden');
                idx = next;
            }

            function start() {
                if (reducedMotion.matches || timer) return;
                timer = setInterval(function () { show((idx + 1) % nodes.length); }, HOLD);
            }

            function stop() {
                if (timer) { clearInterval(timer); timer = null; }
            }

            start();

            var container = document.querySelector('.rotating-headline');
            if (container) {
                container.addEventListener('mouseenter', stop);
                container.addEventListener('mouseleave', start);
                container.addEventListener('focusin', stop);
                container.addEventListener('focusout', start);
            }

            // Pause when the tab is hidden to save resources
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) stop();
                else start();
            });

            try {
                reducedMotion.addEventListener('change', function () {
                    if (reducedMotion.matches) stop();
                    else start();
                });
            } catch (e) { /* older browsers — ignore */ }
        })();

        // Expanding menu — first click opens the branch in place (no navigation)
        (function () {
            document.querySelectorAll('.path-head').forEach(function (h) {
                h.addEventListener('click', function () {
                    var card = h.closest('.path-card');
                    var open = card.classList.toggle('open');
                    h.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
            });
        })();
    </script>
</body>
</html>
