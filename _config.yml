# Jekyll site configuration — schuckdata.com
# https://jekyllrb.com/docs/configuration/

title: Schuck Data
description: Dashboards, data pipelines, and data quality.
url: https://schuckdata.com
lang: en

# Files Jekyll should ignore (won't be copied to the built site)
exclude:
  - README.md
  - LICENSE
  - docs/
  - mockups/        # workshop reference pages — kept in repo, not published
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/

# Jekyll skips files and directories beginning with a dot by default, silently
# and with no warning, so .well-known/ would simply never appear on the built
# site. It has to be named here to survive the build.
#
# This is load-bearing, not tidiness. Android verifies the Pretty Number Machine
# Android app against https://schuckdata.com/.well-known/assetlinks.json; if
# that file 404s, the installed app still runs but shows a browser address bar
# across the top forever. Asset links are checked at the DOMAIN ROOT, which is
# this repo — not the app's own repo, which serves the /pretty-number-machine/
# path. See docs/PLAY-STORE-HANDOFF.md section 2 in that repo.
#
# The fix usually suggested for this — adding an empty .nojekyll file — would
# BREAK this site, because it disables Jekyll entirely and takes the
# jekyll-redirect-from plugin below with it, along with every legacy uppercase
# redirect. Do not do that. This include: line is the correct fix.
include:
  - .well-known

# Keep the build minimal. jekyll-redirect-from is a GitHub Pages-supported
# plugin; it generates redirect stubs at the old UPPERCASE paths (declared via
# `redirect_from:` in each page's front matter) so links to the pre-2026-06
# capitalized routes don't 404 after the move to lowercase URLs.
plugins:
  - jekyll-redirect-from
