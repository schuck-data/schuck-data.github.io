<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue to SVSD on Facebook</title>
    <meta name="robots" content="noindex">
    <!-- Visible interstitial (2s) instead of an instant 0s redirect — friendlier for QR scans and
         avoids the "instant redirect to social" pattern that web filters flag. -->
    <meta http-equiv="refresh" content="2; url=https://www.facebook.com/share/g/1FXQJADPLw/">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: linear-gradient(165deg, #15293f, #1e3a5f); color: #fff; padding: 1.5rem;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .card { max-width: 26rem; text-align: center; }
        h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
        p { color: rgba(255,255,255,0.8); line-height: 1.55; margin: 0 0 1.5rem; }
        a.btn { display: inline-block; background: #93c5fd; color: #15293f; text-decoration: none;
                font-weight: 600; padding: 0.75rem 1.4rem; border-radius: 999px; }
        a.btn:hover { background: #bfdbfe; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Taking you to SVSD on Facebook…</h1>
        <p>You're being redirected to the <strong>SVSD — Susquehanna Valley Social Dance</strong> Facebook group. If it doesn't open automatically, use the button below.</p>
        <a class="btn" href="https://www.facebook.com/share/g/1FXQJADPLw/">Continue to Facebook →</a>
    </div>
</body>
</html>
