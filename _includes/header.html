<header class="site-header{% if page.hide_header_logo %} no-logo{% endif %}">
    <div class="site-header-inner">
        {% unless page.hide_header_logo %}
        <a class="site-logo" href="/" aria-label="Schuck Data — home">
            <img src="/images/schuck-data-white-crop.png" alt="Schuck Data">
        </a>
        {% endunless %}

        <nav class="site-nav" aria-label="Primary">
            <a href="/services/"{% if page.nav == 'services' %} aria-current="page"{% endif %}>Services</a>
            <a href="/founder/"{% if page.nav == 'founder' %} aria-current="page"{% endif %}>Founder</a>
            <a href="/careers/"{% if page.nav == 'careers' %} aria-current="page"{% endif %}>Careers</a>
            <a href="/contact/"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
        </nav>
    </div>
</header>
